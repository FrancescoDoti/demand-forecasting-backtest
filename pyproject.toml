[project]
name = "dfb"
version = "0.1.0"
description = "Day-ahead demand forecasting with rolling-origin backtests, a leakage-aware feature design and conformal prediction intervals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "lightgbm>=4.0", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dfb"]
